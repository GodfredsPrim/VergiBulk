services:
  - type: web
    name: vegibulk-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: SECRET_KEY
        scope: project
      - key: ALLOWED_ORIGINS
        value: "*"
